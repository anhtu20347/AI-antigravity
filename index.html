<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cú Đêm · Trợ Lý AI Học Xác Suất &amp; Thống Kê</title>

<!-- TailwindCSS CDN & Google Fonts -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<!-- MathJax 3.2 Typesetting -->
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>

<!-- Tách biệt CSS Module -->
<link rel="stylesheet" href="src/styles/app.css">
</head>

<body class="min-h-screen">
<!-- Thanh điều hướng Header trên cùng -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b-4 border-[#2D2A4A] px-3 py-2 flex flex-wrap items-center gap-2">
  <div class="flex items-center gap-2 mr-auto cursor-pointer" onclick="go('home')">
    <span id="logo"></span>
    <b class="text-lg leading-tight text-[#2D2A4A]">Cú Đêm<br><span class="text-xs font-bold text-indigo-900">Xác suất &amp; Thống kê AI</span></b>
  </div>
  <button id="homeBtn" class="bt hidden text-sm" onclick="go('home')">🏠 Về Trang Chủ</button>
  <div id="authArea" class="flex items-center gap-2"></div>
  <input id="key" type="password" placeholder="Gemini API Key" class="w-32 text-xs md:text-sm">
  <input id="model" list="mlist" class="text-xs md:text-sm w-36" placeholder="Tên model">
  <datalist id="mlist">
    <option value="gemini-2.5-flash">
    <option value="gemini-2.0-flash">
    <option value="gemini-1.5-flash">
    <option value="gemini-3.8-flash">
  </datalist>
  <button class="bt text-xs md:text-sm" onclick="saveKey()">💾 Lưu Key</button>
</header>

<!-- Thanh Menu chuyển đổi 8 phân hệ chức năng -->
<nav id="nav" class="flex gap-1.5 flex-wrap px-3 py-2 max-w-6xl mx-auto"></nav>

<!-- Vùng hiển thị nội dung chính -->
<main id="app" class="max-w-6xl mx-auto p-3 md:p-6"></main>

<!-- Thông báo Toast -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 pc px-4 py-2 font-extrabold hidden z-50"></div>

<!-- Hộp thoại Đăng nhập / Đăng ký Tài khoản -->
<div id="authModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
  <div class="pc p-5 max-w-md w-full bg-white">
    <div class="flex gap-2 mb-4">
      <button id="tabLoginBtn" class="bt flex-1 on text-sm" onclick="switchAuthTab('login')">🔑 Đăng nhập</button>
      <button id="tabRegBtn" class="bt flex-1 text-sm" onclick="switchAuthTab('register')">✨ Tạo tài khoản</button>
      <button class="bt bg-white text-xs px-2" onclick="closeAuthModal()">✕</button>
    </div>

    <!-- Form Đăng nhập -->
    <div id="formLogin">
      <h3 class="text-xl font-black">Chào mừng bạn quay lại!</h3>
      <p class="text-xs font-bold text-gray-600 mt-1">Đăng nhập bằng Gmail và mật khẩu để kết nối bạn bè:</p>
      <label class="block text-sm font-bold mt-3">Tài khoản Gmail
        <input id="lEmail" type="email" class="w-full mt-1" placeholder="sinhvien@gmail.com">
      </label>
      <label class="block text-sm font-bold mt-2">Mật khẩu
        <input id="lPass" type="password" class="w-full mt-1" placeholder="Nhập mật khẩu..." onkeydown="if(event.key==='Enter')doLogin()">
      </label>
      <button class="bt w-full mt-4 bg-[#BFF1DC]" onclick="doLogin()">🔑 Đăng nhập ngay</button>
      <div class="text-center text-xs font-bold my-2 text-gray-500">— HOẶC —</div>
      <button class="bt w-full bg-white text-sm" onclick="loginGooglePopup()">🔐 Tiếp tục bằng tài khoản Google</button>
    </div>

    <!-- Form Đăng ký -->
    <div id="formRegister" class="hidden">
      <h3 class="text-xl font-black">Tạo tài khoản mới</h3>
      <p class="text-xs font-bold text-gray-600 mt-1">Tạo tài khoản riêng để kết bạn, nhắn tin và đăng bài trên Diễn đàn:</p>
      <label class="block text-sm font-bold mt-3">Tên hiển thị của bạn
        <input id="rName" type="text" class="w-full mt-1" placeholder="VD: Nguyễn Văn A">
      </label>
      <label class="block text-sm font-bold mt-2">Tài khoản Gmail
        <input id="rEmail" type="email" class="w-full mt-1" placeholder="sinhvien@gmail.com">
      </label>
      <label class="block text-sm font-bold mt-2">Mật khẩu (tối thiểu 4 ký tự)
        <input id="rPass" type="password" class="w-full mt-1" placeholder="Tạo mật khẩu...">
      </label>
      <label class="block text-sm font-bold mt-2">Chọn biểu tượng đại diện
        <select id="rAvatar" class="w-full mt-1">
          <option value="🦊">🦊 Cáo Thông Thái</option>
          <option value="🐻">🐻 Gấu Chăm Chỉ</option>
          <option value="🐼">🐼 Gấu Trúc Đáng Yêu</option>
          <option value="🐨">🐨 Koala Điềm Đạm</option>
          <option value="🐸">🐸 Ếch Xanh Năng Động</option>
          <option value="🐯">🐯 Hổ Vàng Bản Lĩnh</option>
          <option value="🦄">🦄 Kỳ Lân Sáng Tạo</option>
        </select>
      </label>
      <button class="bt w-full mt-4 bg-[#D9C9FF]" onclick="doRegister()">✨ Hoàn tất Tạo tài khoản</button>
    </div>
  </div>
</div>

<!-- Nạp các module JavaScript độc lập theo cấu trúc phân rã Clean Architecture -->
<script src="src/data/constants.js"></script>
<script src="src/data/bank.js"></script>
<script src="src/services/canvas3d.js"></script>
<script src="src/services/gemini.js"></script>
<script src="src/services/speech.js"></script>
<script src="src/services/firebase.js"></script>
<script src="src/components/pad.js"></script>
<script src="src/components/pedagogy.js"></script>
<script src="src/components/practice.js"></script>
<script src="src/components/exam.js"></script>
<script src="src/components/tutor.js"></script>
<script src="src/components/oral_exam.js"></script>
<script src="src/components/stats.js"></script>
<script src="src/components/forum.js"></script>
<script src="src/components/home.js"></script>

<!-- Khởi động ứng dụng -->
<script>
document.body.insertAdjacentHTML('beforeend',
  '<div class="fixed bottom-4 right-4 z-40 text-right">' +
  '<div id="fpanel" class="hidden pc p-3 mb-2 w-80 max-h-[70vh] overflow-y-auto text-left text-sm">' +
  '<div class="flex items-center gap-2"><b>🦉 Trạm Vấn Đáp Voice AI</b>' +
  '<button class="bt text-xs ml-auto" onclick="speakOn=!speakOn;toast(speakOn?\'Đã bật giọng đọc 🔊\':\'Đã tắt giọng đọc 🔇\')">🔊 / 🔇</button></div>' +
  vBlock('fl','',false) + '</div>' +
  '<button class="bt bg-[#D9C9FF]" onclick="$(\'#fpanel\').classList.toggle(\'hidden\')">🎙️ Đàm thoại trực tiếp với Cú Đêm</button></div>'
);

(function initApp(){
  var c = ls.get('cfg', {});
  KEY = c.k || '';
  MODEL = c.m || 'gemini-2.5-flash';
  if($('#key')) $('#key').value = KEY;
  if($('#model')) $('#model').value = MODEL;
  if($('#logo')) $('#logo').innerHTML = owl(42, false);
  initFirebase();
  renderAuth();
  render();
  startSync();
})();
</script>
</body>
</html>
